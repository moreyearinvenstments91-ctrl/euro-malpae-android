
name: EURO MALPAE Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")
          data = p.read_bytes()

          # Remove UTF-8 BOM and leading whitespace
          data = data.lstrip(b"\xef\xbb\xbf \t\r\n")

          # Keep only the first XML declaration
          declaration = b'<?xml'
          first = data.find(declaration)

          if first > 0:
              data = data[first:]

          # Remove duplicate XML declarations
          marker = b'<?xml'
          first = data.find(marker)
          if first >= 0:
              before = data[:first + 1]
              after = data[first + 1:]
              after = after.replace(marker, b'')
              data = before + after

          p.write_bytes(data)

          print("Cleaned manifest:")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Validate Manifest XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease

      - name: Build Release AAB
        run: gradle --no-daemon bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: EURO-MALPAE-ANDROID
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
