
name: EURO MALPAE Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."
          test -f app/src/main/AndroidManifest.xml
          cat -n app/src/main/AndroidManifest.xml

      - name: Validate Manifest XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout app/src/main/AndroidManifest.xml

      - name: Diagnose Android Manifest
        run: |
          gradle --no-daemon :app:processDebugMainManifest --stacktrace --info

      - name: Build Debug APK
        if: success()
        run: gradle --no-daemon assembleDebug

      - name: Build Release APK
        if: success()
        run: gradle --no-daemon assembleRelease

      - name: Build Android App Bundle
        if: success()
        run: gradle --no-daemon bundleRelease

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EURO-MALPAE-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EURO-MALPAE-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EURO-MALPAE-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
