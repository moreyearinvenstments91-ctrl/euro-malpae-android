plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.euromalpae.recruitment'
    compileSdk 35

    defaultConfig {
        applicationId 'com.euromalpae.recruitment'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }

        release {
            minifyEnabled false
        }
    }
}
